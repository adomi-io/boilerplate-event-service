# Runs the tests, builds the image for each platform on native runners and publishes one manifest.
# A pull request runs the tests and an amd64 build without pushing.
name: Docker

on:
  workflow_dispatch:
    inputs:
      target_platforms:
        description: "Target platforms for buildx (e.g., linux/amd64,linux/arm64)"
        required: false
        default: "linux/amd64,linux/arm64"
      image_tag:
        description: "Optional: override the image tag (defaults to latest plus date and sha tags)"
        required: false
        default: ""
      skip_tests:
        description: "Skip the tests when building this image"
        type: boolean
        default: false

  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests || false }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        if: env.SKIP_TESTS != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: env.SKIP_TESTS != 'true'
        run: pip install -r requirements.txt

      - name: Run the unit tests
        if: env.SKIP_TESTS != 'true'
        run: python -m unittest discover -s tests -v

  prepare:
    runs-on: ubuntu-latest

    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}

    steps:
      # A dispatch builds what you picked, a pull request builds amd64 only, a push builds both
      - name: Choose the platforms
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORMS: ${{ inputs.target_platforms }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              platforms="${INPUT_PLATFORMS:-linux/amd64,linux/arm64}"
              ;;
            pull_request)
              platforms="linux/amd64"
              ;;
            *)
              platforms="linux/amd64,linux/arm64"
              ;;
          esac

          echo "platforms=$(jq -cR 'split(",") | map(gsub("\\s"; "")) | map(select(. != ""))' <<< "$platforms")" >> "$GITHUB_OUTPUT"

  # Each platform builds on its own hardware, no emulation
  build:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    needs:
      - test
      - prepare

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}

    concurrency:
      group: docker-${{ matrix.platform }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    env:
      PLATFORM_PAIR: ${{ matrix.platform == 'linux/arm64' && 'linux-arm64' || 'linux-amd64' }}
      CACHE_REF: ghcr.io/${{ github.repository }}:cache-${{ matrix.platform == 'linux/arm64' && 'linux-arm64' || 'linux-amd64' }}
      SMOKE_IMAGE_TAG: ghcr.io/${{ github.repository }}:smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The smoke test runs on amd64 only, a pull request can only read the cache
      - name: Build image for the smoke test
        if: ${{ matrix.platform == 'linux/amd64' && env.SKIP_TESTS != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.SMOKE_IMAGE_TAG }}
          load: true
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}

      - name: Smoke test the image
        if: ${{ matrix.platform == 'linux/amd64' && env.SKIP_TESTS != 'true' }}
        run: tests/smoke.sh "$SMOKE_IMAGE_TAG"

      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the digests of each platform into one manifest under the tags
  publish:
    runs-on: ubuntu-latest

    needs:
      - build

    if: github.event_name != 'pull_request'

    concurrency:
      group: docker-publish-release
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_TAG: ${{ inputs.image_tag || '' }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }},enable=${{ env.IMAGE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.IMAGE_TAG == '' }}
            type=raw,value={{date 'YYYY-MM-DD'}},enable=${{ env.IMAGE_TAG == '' }}
            type=sha,format=short,enable=${{ env.IMAGE_TAG == '' }}

      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          sources=()
          for digest in *; do
            sources+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect the published image
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
